<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultron</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:360px;font-family:Inter,system-ui,sans-serif;background:#0A0A0B;color:#fff}
    .wrap{padding:14px}
    .head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#141416;border:1px solid #232326;border-radius:14px}
    .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#7C3AED,#0F62FE);display:grid;place-items:center;font-weight:800;font-size:14px}
    .title{font-size:14px;font-weight:800;letter-spacing:-.02em}
    .sub{font-size:11px;color:#A1A1AA;margin-top:2px}
    .card{background:#141416;border:1px solid #232326;border-radius:14px;padding:12px;margin-top:10px}
    .label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A1A1AA}
    select,input{width:100%;margin-top:6px;height:36px;padding:0 10px;border-radius:10px;background:#0A0A0B;border:1px solid #232326;color:#fff;font-size:12px}
    .row{display:flex;gap:8px;margin-top:10px}
    .btn{flex:1;height:36px;border-radius:10px;border:1px solid #232326;background:#1E1E21;color:#fff;font-size:12px;font-weight:650;cursor:pointer}
    .btn.primary{background:#fff;color:#000;border-color:#fff}
    .hint{font-size:11px;color:#71717A;margin-top:6px;line-height:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="logo">U</div>
      <div>
        <div class="title">Ultron</div>
        <div class="sub">Privacy guard for AI</div>
      </div>
      <span style="margin-left:auto;font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px;background:#fff;color:#000">v2</span>
    </div>

    <div class="card">
      <div class="label">Model</div>
      <select id="model">
        <option value="qwen3b">Qwen 2.5 3B — Groq (fast)</option>
        <option value="llama3b">Llama 3.2 3B — Groq</option>
        <option value="gemini-flash">Gemini 2.0 Flash</option>
      </select>
    </div>

    <div class="card">
      <div class="label">Keys</div>
      <input id="groq" placeholder="Groq gsk_..." style="margin-top:8px">
      <input id="gemini" placeholder="Gemini AIza..." style="margin-top:8px">
      <div class="hint">Stored locally only. Get from console.groq.com & aistudio.google.com</div>
    </div>

    <div class="card" style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:13px;font-weight:650">Vault</div>
        <div style="font-size:11px;color:#A1A1AA">Keep format so AI still answers</div>
      </div>
      <input type="checkbox" id="vault" style="width:18px;height:18px">
    </div>

    <div class="row">
      <button id="save" class="btn primary">Save</button>
      <button id="clear" class="btn">Clear</button>
    </div>
    <div id="status" class="hint" style="text-align:center"></div>
  </div>
  <script src="src/popup.js"></script>
</body>
</html>
